
<!DOCTYPE html>

.json-editor-container {
  font-family: Segoe UI;

}

.json-editor-container .well {

  padding: 16px;

}

}

}

  outline: none;
  border-color: #3b82f6;

}

.json-editor-container button {
  background: #f8fafc;
  border: 1px solid #d1d5db;
  border-radius: 4px;

  transition: all 0.2s ease;
}

.json-editor-container button:hover {

}

.json-editor-container .property-name {
